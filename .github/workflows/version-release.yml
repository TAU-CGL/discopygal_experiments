name: Version release

env:
  PYTHON_VERSION: 3.12.3
  GCC_MAJOR_VERSION: 12
  QT_QPA_PLATFORM: offscreen
  CI: 1

on:
  workflow_dispatch:

jobs:

  # ============================================================
  # BUILD PACKAGE
  # ============================================================

  build_package:
    runs-on: ubuntu-latest

    outputs:
      package_zip_file: ${{ steps.build_package.outputs.package_zip_file }}
      package_whl_file: ${{ steps.build_package.outputs.package_whl_file }}
      starter_package_whl_file: ${{ steps.build_starter_package.outputs.starter_package_whl_file }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Clone discopygal
        run: git clone https://${{ secrets.MY_GITHUB_PAT }}@github.com/TAU-CGL/discopygal.git

      - name: Install Qt6 dependencies for ARM64
        if: runner.arch == 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            build-essential

      - name: Preparing requirements
        run: |
          pip install build findpydeps

      # ----------------------------------------------------------
      # Build main package
      # ----------------------------------------------------------

      - name: Build package
        id: build_package
        run: |
          python scripts/build_package.py

          WHL=$(basename "$(ls dist/*.whl)")

          echo "Built wheel: $WHL"

          mkdir -p release

          cp "dist/$WHL" release/
          cp install.py release/
          cp scripts/build_cgal_variants.py release/

          cd release

          zip "../discopygal-release.zip" *

          echo "package_whl_file=$WHL" >> "$GITHUB_OUTPUT"
          echo "package_zip_file=discopygal-release.zip" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Release contents:"
          unzip -l ../discopygal-release.zip
        working-directory: ./discopygal

      # ----------------------------------------------------------
      # Upload release ZIP
      # ----------------------------------------------------------

      - name: Upload Discopygal release
        uses: actions/upload-artifact@v4
        with:
          name: discopygal-release
          path: discopygal/discopygal-release.zip

      # ----------------------------------------------------------
      # Build starter package
      # ----------------------------------------------------------

      - name: Build starter package
        id: build_starter_package
        run: |
          rm -rf dist

          python scripts/build_starter_package.py

          WHL=$(basename "$(ls dist/*.whl)")

          # install.py globs for the wheel beside it and needs
          # build_cgal_variants.py in the same directory.
          cp install.py dist/
          cp scripts/build_cgal_variants.py dist/

          echo "starter_package_whl_file=$WHL" >> "$GITHUB_OUTPUT"
        working-directory: ./discopygal

      - name: Upload Discopygal-Starter package
        uses: actions/upload-artifact@v4
        with:
          name: starter_package
          path: discopygal/dist/


  # ============================================================
  # BUILD DOCUMENTATION
  # ============================================================

  build_docs:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install GCC ${{ env.GCC_MAJOR_VERSION }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-${{ env.GCC_MAJOR_VERSION }} \
            g++-${{ env.GCC_MAJOR_VERSION }}

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            build-essential

      - name: Clone discopygal
        run: git clone https://${{ secrets.MY_GITHUB_PAT }}@github.com/TAU-CGL/discopygal.git

      - name: Increase conan timeout
        run: |
          mkdir -p ~/.conan2
          echo "core.net.http:timeout=600" >> ~/.conan2/global.conf

      - name: Preparing requirements
        run: |
          pip install pipenv

          CC=gcc-${{ env.GCC_MAJOR_VERSION }} \
          CXX=g++-${{ env.GCC_MAJOR_VERSION }} \
          pipenv install \
            --python $(which python) \
            --dev \
            --verbose

          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            dvipng
        working-directory: ./discopygal

      - name: Build docs
        run: |
          pipenv run make clean
          pipenv run make html
        working-directory: ./discopygal/docs

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          path: discopygal/docs/_build/html
          name: html_docs


  # ============================================================
  # CHECK MAIN PACKAGE
  # ============================================================

  check_package:
    runs-on: ${{ matrix.os }}
    needs: build_package

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-22.04
          - windows-2025
          - windows-2022
          - macos-15
          - macos-14

        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ----------------------------------------------------------
      # Windows
      # ----------------------------------------------------------

      # winget is unavailable on GitHub-hosted Windows runners (App Installer
      # is not registered for the service account), so install Qt6 via action.
      - name: Install Qt6 on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Verify Qt6 on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Qt at $env:QT_ROOT_DIR"
          qmake -v

      # ----------------------------------------------------------
      # Linux
      # ----------------------------------------------------------

      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gcc-${{ env.GCC_MAJOR_VERSION }} \
            g++-${{ env.GCC_MAJOR_VERSION }} \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev

          echo "CC=gcc-${{ env.GCC_MAJOR_VERSION }}" >> $GITHUB_ENV
          echo "CXX=g++-${{ env.GCC_MAJOR_VERSION }}" >> $GITHUB_ENV

      # ----------------------------------------------------------
      # macOS
      # ----------------------------------------------------------

      - name: Setup macOS
        if: runner.os == 'macOS'
        run: |
          pip install pyqt6

      # ----------------------------------------------------------
      # Download release ZIP
      # ----------------------------------------------------------

      - name: Download Discopygal release
        uses: actions/download-artifact@v4
        with:
          name: discopygal-release
          path: release

      # ----------------------------------------------------------
      # Extract release ZIP
      # ----------------------------------------------------------

      - name: Extract Discopygal release
        shell: bash
        run: |
          mkdir -p release/extracted

          unzip \
            release/${{ needs.build_package.outputs.package_zip_file }} \
            -d release/extracted

          echo "Release contents:"
          find release/extracted -maxdepth 2 -type f

      # ----------------------------------------------------------
      # Install package
      # ----------------------------------------------------------

      - name: Increase conan timeout
        run: |
          mkdir -p ~/.conan2
          echo "core.net.http:timeout=600" >> ~/.conan2/global.conf

      # The wheel's bindings import a configuration-specific CGALPY module
      # (e.g. CGALPY_kerEpecInt_..._aos2CsVeHeFePl_...), which a plain
      # "pip install <whl>" never produces. install.py ships in the release
      # ZIP precisely to build and install those CGAL variants.
      - name: Patch installer for scikit-build-core >= 0.10
        shell: bash
        working-directory: release/extracted
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ("install.py", "build_cgal_variants.py"):
              path = Path(filename)
              if not path.exists():
                  continue

              content = path.read_text(encoding="utf-8")
              patched = content.replace("cmake.verbose", "build.verbose")

              if patched != content:
                  path.write_text(patched, encoding="utf-8")
          PY

      - name: Install Discopygal
        shell: bash
        working-directory: release/extracted
        run: |
          python install.py

      - name: Verify CGALPY bindings import
        shell: bash
        run: |
          python -c "import discopygal.bindings as b; print('bindings OK:', b.__file__)"

      # ----------------------------------------------------------
      # Clone source for tests
      # ----------------------------------------------------------

      - name: Clone discopygal
        run: git clone https://${{ secrets.MY_GITHUB_PAT }}@github.com/TAU-CGL/discopygal.git

      - name: Install test dependencies
        run: |
          pip install pytest

      # ----------------------------------------------------------
      # Tests
      # ----------------------------------------------------------

      - name: Run tests
        run: |
          pytest -v ./tests -m sanity
        working-directory: ./discopygal

      - name: Run GUI tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb

          export DISPLAY=:99

          xvfb-run -a \
            pytest -vs ./tests -m gui
        working-directory: ./discopygal

      - name: Run GUI tests
        if: runner.os != 'Linux'
        run: |
          pytest -vs ./tests -m gui
        working-directory: ./discopygal


  # ============================================================
  # CHECK STARTER PACKAGE
  # ============================================================

  check_starter_package:
    runs-on: ${{ matrix.os }}
    needs: build_package

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-22.04
          - windows-2025
          - windows-2022
          - macos-15
          - macos-14

        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ----------------------------------------------------------
      # Windows
      # ----------------------------------------------------------

      # winget is unavailable on GitHub-hosted Windows runners (App Installer
      # is not registered for the service account), so install Qt6 via action.
      - name: Install Qt6 on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Verify Qt6 on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Qt at $env:QT_ROOT_DIR"
          qmake -v

      # ----------------------------------------------------------
      # Linux
      # ----------------------------------------------------------

      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gcc-${{ env.GCC_MAJOR_VERSION }} \
            g++-${{ env.GCC_MAJOR_VERSION }} \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev

          echo "CC=gcc-${{ env.GCC_MAJOR_VERSION }}" >> $GITHUB_ENV
          echo "CXX=g++-${{ env.GCC_MAJOR_VERSION }}" >> $GITHUB_ENV

      # ----------------------------------------------------------
      # macOS
      # ----------------------------------------------------------

      - name: Setup macOS
        if: runner.os == 'macOS'
        run: |
          pip install pyqt6

      # ----------------------------------------------------------
      # Download starter package
      # ----------------------------------------------------------

      - name: Download Discopygal starter package
        uses: actions/download-artifact@v4
        with:
          name: starter_package
          path: starter_package

      # ----------------------------------------------------------
      # Install starter package
      # ----------------------------------------------------------

      - name: Increase conan timeout
        run: |
          mkdir -p ~/.conan2
          echo "core.net.http:timeout=600" >> ~/.conan2/global.conf

      # Same CGALPY-variant requirement as the main package: the starter
      # tests import discopygal.bindings, so run the shipped installer
      # rather than a plain pip install of the wheel.
      - name: Patch installer for scikit-build-core >= 0.10
        shell: bash
        working-directory: starter_package
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ("install.py", "build_cgal_variants.py"):
              path = Path(filename)
              if not path.exists():
                  continue

              content = path.read_text(encoding="utf-8")
              patched = content.replace("cmake.verbose", "build.verbose")

              if patched != content:
                  path.write_text(patched, encoding="utf-8")
          PY

      - name: Install Discopygal
        shell: bash
        working-directory: starter_package
        run: |
          python install.py

      - name: Verify CGALPY bindings import
        shell: bash
        run: |
          python -c "import discopygal.bindings as b; print('bindings OK:', b.__file__)"

      # ----------------------------------------------------------
      # Clone source for tests
      # ----------------------------------------------------------

      - name: Clone discopygal
        run: git clone https://${{ secrets.MY_GITHUB_PAT }}@github.com/TAU-CGL/discopygal.git

      - name: Install test dependencies
        run: |
          pip install pytest

      # ----------------------------------------------------------
      # Tests
      # ----------------------------------------------------------

      - name: Run tests
        run: |
          pytest -vs \
            ./tests/solvers/test_solvers.py \
            ./tests/solvers/test_starter.py \
            -m starter
        working-directory: ./discopygal

      - name: Run GUI tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb

          export DISPLAY=:99

          xvfb-run -a \
            pytest -vs \
            ./tests/solvers/test_solver_viewer.py \
            -m starter
        working-directory: ./discopygal

      - name: Run GUI tests
        if: runner.os != 'Linux'
        run: |
          pytest -vs \
            ./tests/solvers/test_solver_viewer.py \
            -m starter
        working-directory: ./discopygal
